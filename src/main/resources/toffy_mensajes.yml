# =====================================================================================================
#  toffy_mensajes.yml: MENSAJES de chat de Toffy Complementaries (torneos)
# =====================================================================================================
#  Cada clave es un caso. Se puede usar:
#    - Colores con &  (por ejemplo &a verde, &e amarillo, &c rojo, &l negrita, &r reset).
#    - Estos marcadores, que se reemplazan por su valor:
#        {jugador}  nombre del jugador
#        {torneo}   nombre del torneo tal como se escribio al crearlo
#        {cantidad} cantidad de participantes anotados
#        {x} {y} {z} {mundo}  lugar al que se llevo o devolvio al jugador (solo en llevado y devuelto)
#        {evento}   nombre del evento (solo en los mensajes de eventos)
#        {segundos} segundos que faltan para empezar (evento-lobby)
#        {motivo}   por que (evento-eliminado, evento-cancelado)
#        {detalle}  como termino el evento (evento-fin)
#    - Un texto vacio ("") significa NO enviar nada en ese caso.
#  Cada torneo puede tener su propio texto para un caso con:
#    /toffy torneo mensaje <torneo> <caso> <texto...>      (y con "reset" vuelve a este archivo)
#  Orden de busqueda: texto del torneo -> este archivo -> texto por defecto del plugin.
#  Despues de editar: /toffy reload

# Se lo dice al jugador que se acaba de anotar con /anotar.
anotado: "&aTe anotaste al torneo &e{torneo}&a. Sos el participante &e#{cantidad}&a."

# Se lo dice al jugador que ya estaba anotado.
ya-anotado: "&eYa estabas anotado en el torneo &6{torneo}&e."

# Se lo dice al jugador cuando las inscripciones del torneo estan cerradas.
inscripcion-cerrada: "&cLa inscripcion al torneo &e{torneo}&c esta cerrada."

# Se lo dice al jugador cuando el torneo que escribio no existe ({torneo} es lo que escribio).
torneo-no-existe: "&cNo existe el torneo &e{torneo}&c."

# Anuncio para TODO el servidor cada vez que alguien se anota. Vacio = sin anuncio.
anuncio-anotado: ""

# Anuncio para todo el servidor al cerrar las inscripciones (/toffy torneo cerrar <torneo>).
# Si el comando lleva un texto propio, se usa ese texto en lugar de este.
cierre: "&6Se cerraron las inscripciones al torneo &e{torneo}&6. Participantes: &e{cantidad}&6."

# Anuncio para todo el servidor al volver a abrir las inscripciones. Vacio = sin anuncio.
apertura: ""

# Se lo dice a cada participante que se lleva con /toffy tp concursantes.
llevado: "&aFuiste llevado al torneo &e{torneo}&a."

# Se lo dice a cada participante que se devuelve con /toffy tp devolver (o al entrar si estaba desconectado).
devuelto: "&aVolviste a donde estabas antes del torneo &e{torneo}&a."

# Se lo dice a un participante conectado al que no hay donde devolver (nunca se lo llevo).
sin-lugar-guardado: "&cNo hay un lugar guardado para devolverte del torneo &e{torneo}&c."

# ---------------------------------------------------------------------------------------------------
#  Eventos (los inicia el staff con /toffy evento iniciar <tipo> <torneo>). Son sobre el torneo:
#  el texto de un torneo (/toffy torneo mensaje) tiene prioridad sobre estos.
# ---------------------------------------------------------------------------------------------------

# Anuncio para TODO el servidor al abrir la espera de un evento, con el boton [UNIRSE]. Vacio = sin anuncio.
evento-lobby: "&6Va a empezar el evento &e{evento}&6 en &e{segundos} s&6. Anotate con &e/anotar {torneo}&6 para entrar."

# Se lo dice al jugador que entra al evento (los anotados online entran solos; los demas con /anotar durante la espera).
evento-unido: "&aEntraste al evento &e{evento}&a. Tu inventario queda guardado y lo recuperas al salir."

# Se lo dice a los que siguen en el evento cuando alguien sale por su cuenta (/anotar salir).
evento-salio: "&7{jugador} salio del evento &e{evento}&7. Quedan &e{cantidad}&7."

# Se lo dice a los participantes cuando la arena empieza.
evento-empieza: "&e{evento} empieza! &7Participantes: &e{cantidad}&7."

# Anuncio para TODO el servidor con el ganador.
evento-ganador: "&6&l{jugador} &7gano el evento &e{evento}&7."

# Se lo dice a los participantes cuando alguien queda afuera (murio, se cayo, exploto o se desconecto).
evento-eliminado: "&c{jugador} quedo eliminado ({motivo}). &7Quedan &e{cantidad}&7."

# Anuncio para TODO el servidor cuando se cancela el evento (lo para el staff o no hay suficientes jugadores).
evento-cancelado: "&c{evento} se cancelo. &7{motivo}"

# Anuncio para TODO el servidor al terminar el evento. {detalle} es el motivo del final (por ejemplo, se acabo el tiempo).
evento-fin: "&e{evento} &7termino. {detalle}"
