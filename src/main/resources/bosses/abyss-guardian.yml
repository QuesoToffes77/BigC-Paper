id: abyss-guardian
display-name: "GUARDIÁN DEL ABISMO"
maximum-health: 20000.0
audience-radius: 64.0

ui:
  update-ticks: 5

phases:
  phase-2-at: 0.66
  phase-3-at: 0.33

category-weights:
  physical: 0.25
  magic: 0.5
  movement: 0.1
  defensive: 0.75

animations:
  idle:
    type: LOOPING
    duration-ticks: 60
    scale: [1.0, 1.0]
    y-offset: [0.0, 1.0]
    y-rotation: [0, 0]
    priority: 0
  cast:
    type: ONE_SHOT
    duration-ticks: 40
    scale: [1.0, 1.2]
    y-offset: [0.0, 0.5]
    y-rotation: [0, 0]
    priority: 10
  rage:
    type: LOOPING
    duration-ticks: 10
    scale: [1.0, 1.0]
    y-offset: [0.0, 0.0]
    y-rotation: [-4, 4]
    priority: 20
  slam:
    type: ONE_SHOT
    duration-ticks: 20
    scale: [1.0, 1.3]
    y-offset: [0.5, -0.5]
    y-rotation: [0, 0]
    priority: 15

abilities:
  void-pulse:
    category: MAGIC
    animation: cast
    cooldown-seconds: 18.0
    cast-time-seconds: 3.0
    priority: 50
    interruptible: false
    conditions:
      - type: HEALTH_BELOW
        value: 0.75
      - type: NOT_CASTING
    targets:
      type: ALL_IN_RADIUS
      radius: 14.0
    telegraph:
      type: CIRCLE
      radius: 14.0
      particle: minecraft:dust
      warning-sound: minecraft:block.beacon.power_select
    effects:
      - type: DAMAGE
        amount: 8.0
      - type: KNOCKBACK
        strength: 1.4
      - type: MESSAGE
        text: "§5El vacío te rechaza."

  ground-slam:
    category: PHYSICAL
    animation: slam
    cooldown-seconds: 12.0
    cast-time-seconds: 1.5
    priority: 60
    interruptible: false
    conditions:
      - type: TARGET_IN_RANGE
        value: 6.0
      - type: NOT_CASTING
    targets:
      type: NEAREST_PLAYER
      radius: 6.0
      max-targets: 1
    telegraph:
      type: CIRCLE
      radius: 6.0
      particle: minecraft:dust
      warning-sound: minecraft:entity.warden.attack_impact
    effects:
      - type: DAMAGE
        amount: 14.0
      - type: KNOCKBACK
        strength: 2.0
      - type: SOUND
        sound: minecraft:entity.warden.attack_impact

  abyssal-shield:
    category: DEFENSIVE
    animation: cast
    cooldown-seconds: 30.0
    cast-time-seconds: 2.0
    priority: 40
    interruptible: true
    conditions:
      - type: HEALTH_BELOW
        value: 0.5
      - type: NOT_CASTING
    targets:
      type: ALL_IN_RADIUS
      radius: 20.0
    telegraph:
      type: CIRCLE
      radius: 3.0
      particle: minecraft:dust
      warning-sound: minecraft:block.beacon.activate
    effects:
      - type: SHIELD
        amount: 2000.0
      - type: MESSAGE
        text: "§5El abismo me protege."

dialogue:
  spawn:
    - "§5El aire se vuelve pesado..."
    - "§dAlgo observa desde el vacío."
  phase-2:
    - "§5No podéis contenerme."
  phase-3:
    - "§c§lEL GUARDIÁN ENTRA EN FURIA"
  defeat:
    - "§7El abismo vuelve a quedar en silencio."

music:
  enabled: true
  radius: 64
  stop-when-leaving-radius: true
  fallback-sound: minecraft:music_disc.5
  tracks:
    phase-1: bigcasares:music.abyss_guardian
    phase-2: bigcasares:music.abyss_guardian
    phase-3: bigcasares:music.abyss_guardian
