name: BigCasares
version: '${version}'
main: dev.linqfy.bigCasares.BigCasares
api-version: '26.2'
load: POSTWORLD
depend: [BetterModel]
softdepend: [Vault, PlaceholderAPI, Geyser-Spigot, floodgate]
authors: [ linqfy ]
description: BigCasares core plugin for server modules
libraries:
  - com.pocketcombats:openskill:1.1
  - net.dv8tion:JDA:6.4.1

commands:
  bigcasares:
    description: BigCasares management command
    usage: /<command> give <item_id> [player] [amount]
    aliases: [ bc ]
  shop:
    description: Open the BigCasares shop
    usage: /<command>
  rating:
    description: View skill rating
    usage: /<command> [player]
    aliases: [ skill ]
  peligro:
    description: View your danger level
    usage: /<command> [expandir]
  tumba:
    description: Manage your tombstone
    usage: /<command> abrir
  misiones:
    description: View your missions
    usage: /<command>
  baltop:
    description: View the richest players
    usage: /<command>
  airdrop:
    description: Airdrop management command
    usage: /<command> spawn
    permission: bigcasares.airdrop.spawn
  team:
    description: Create, join and manage BigCasares teams
    usage: /<command> <create|invite|join|leave|kick|dissolve|tag|color|appearance>
  teammanage:
    description: Admin manage BigCasares teams
    usage: /<command> <delete|rename|tag|color|kick>
    permission: bigcasares.team.admin
  nexus:
    description: Manage your team Nexus
    usage: /<command> [place|claim]
  boss:
    description: Manage BigCasares PvE bosses
    usage: /<command> spawn abyss-guardian
    permission: bigcasares.boss.spawn
  servercontrol:
    description: Abre el panel de control del servidor
    usage: /<command>
    aliases: [ control ]
  adminme:
    description: Toggle vanish mode
    usage: /<command>
  bounty:
    description: View the bounty leaderboard
    usage: /<command> top
  bal:
    description: View your balance or the balance leaderboard
    usage: /<command> [top]
    aliases: [ balance ]
  withdraw:
    description: Withdraw balance into a redeemable payment paper
    usage: /<command> <amount>
    aliases: [ widthdraw, pay ]
  linkeardiscord:
    description: Vincula tu cuenta de Minecraft con Discord
    usage: /<command>
  resourcepack:
    description: Reload or send resource pack manually
    usage: /<command>
  mobscaling:
    description: Mob Scaling system management command
    usage: /<command> factor
    permission: bigcasares.mobscaling.admin
  timer:
    description: Start a bossbar timer
    usage: /<command> <seconds> [title]
    permission: bigcasares.command.timer
  endevent:
    description: Manage and debug the one-shot End event
    usage: /<command> <status|validate|optin|portal|arm|abort|reset|debug>
    permission: bigcasares.endevent.admin
  warp:
    description: Opens the warp menu or manages warps
    usage: /<command> [manage]
    aliases: [ warps ]


permissions:
  bigcasares.*:
    description: Full access to BigCasares commands
    default: op
    children:
      bigcasares.command.give: true
      bigcasares.command.give.others: true
      bigcasares.missions.open: true
      bigcasares.missions.claim: true
      bigcasares.missions.admin: true
      bigcasares.shop.open: true
      bigcasares.shop.reload: true
      bigcasares.pack.reload: true
      bigcasares.pack.info: true
      bigcasares.pack.send: true
      bigcasares.items.reload: true
      bigcasares.items.info: true
      bigcasares.skillrating.view: true
      bigcasares.skillrating.view.others: true
      bigcasares.team.appearance: true
      bigcasares.team.edit: true
      bigcasares.team.create: true
      bigcasares.team.join: true
      bigcasares.team.leave: true
      bigcasares.team.admin: true
      bigcasares.nexus.place: true
      bigcasares.boss.spawn: true
      bigcasares.mobscaling.admin: true
      bigcasares.command.timer: true
      bigcasares.endevent.admin: true
      bigcasares.danger.view: true
      bigcasares.danger.view.others: true

  bigcasares.command.timer:
    description: Start a bossbar timer
    default: op

  bigcasares.endevent.admin:
    description: Manage and debug the End event
    default: op

  bigcasares.warp.use:
    description: Use the warp command
    default: true

  bigcasares.warp.manage:
    description: Manage the warp system
    default: op

  bigcasares.mobscaling.admin:
    description: Manage the mob scaling module
    default: op

  bigcasares.command.give:
    description: Give BigCasares custom items to yourself
    default: op

  bigcasares.command.give.others:
    description: Give BigCasares custom items to other players
    default: op
    children:
      bigcasares.command.give: true

  bigcasares.missions.open:
    description: Open the mission HUD
    default: true

  bigcasares.missions.claim:
    description: Claim mission rewards
    default: true

  bigcasares.missions.admin:
    description: Manage player missions
    default: op

  bigcasares.shop.open:
    description: Open the server shop
    default: true

  bigcasares.shop.reload:
    description: Reload BigCasares configs
    default: op

  bigcasares.pack.reload:
    description: Build and activate the BigCasares Java resource pack
    default: op

  bigcasares.pack.info:
    description: View the active BigCasares resource-pack identity and URL
    default: op

  bigcasares.pack.send:
    description: Send the active BigCasares resource pack to Java players
    default: op

  bigcasares.items.reload:
    description: Reload the BigCasares declarative item catalog
    default: op

  bigcasares.items.info:
    description: View the active BigCasares item catalog revision
    default: op

  bigcasares.skillrating.view:
    description: View your own skill rating
    default: true

  bigcasares.skillrating.view.others:
    description: View other players' skill rating
    default: true
  
  bigcasares.airdrop.spawn:
    description: Spawn airdrop manually
    default: op

  bigcasares.team.appearance:
    description: View team appearance
    default: true

  bigcasares.team.edit:
    description: Invite, kick, dissolve or change appearance as team owner
    default: true

  bigcasares.team.create:
    description: Create a BigCasares team
    default: true

  bigcasares.team.join:
    description: Join a BigCasares team using a valid invitation
    default: true

  bigcasares.team.leave:
    description: Leave a BigCasares team as a non-owner member
    default: true

  bigcasares.team.admin:
    description: Administrator access to all teams
    default: op

  bigcasares.nexus.place:
    description: Place the Nexus owned by the player's team
    default: op

  bigcasares.nexus.claim:
    description: Claim the Nexus owned by the player's team
    default: true

  bigcasares.boss.spawn:
    description: Spawn a configured PvE boss
    default: op

  bigcasares.danger.view:
    description: View your own danger level
    default: true

  bigcasares.danger.view.others:
    description: View other players' danger levels
    default: true
